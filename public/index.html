<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Video Extractor</title>


<style>

/* =========================
   ROOT
========================= */

:root {

  --accent: #8b5cf6;
  --accent2: #4f46e5;
  --accent-rgb: 139, 92, 246;

  --bg: #07070d;

  --text: #f8f8ff;

  --muted: #aaaabc;

  --glass:
  rgba(255,255,255,0.06);

  --border:
  rgba(255,255,255,0.12);

}


/* =========================
   RESET
========================= */

* {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

  font-family:
  Arial,
  sans-serif;

}


html {

  scroll-behavior: smooth;

}


body {

  min-height: 100vh;

  color:
  var(--text);

  background:

  radial-gradient(
    circle at top left,
    rgba(var(--accent-rgb), .18),
    transparent 35%
  ),

  var(--bg);

  transition:

  background .6s ease,

  color .4s ease;

  overflow-x: hidden;

}


/* =========================
   BACKGROUND
========================= */

.background {

  position: fixed;

  inset: 0;

  overflow: hidden;

  z-index: -10;

  pointer-events: none;

}


.blob {

  position: absolute;

  width: 450px;

  height: 450px;

  border-radius: 50%;

  background:
  var(--accent);

  filter:
  blur(140px);

  opacity: .18;

  animation:
  blobMove
  14s
  ease-in-out
  infinite;

}


.blob1 {

  top: -180px;

  left: -180px;

}


.blob2 {

  right: -180px;

  bottom: -180px;

  background:
  var(--accent2);

  animation-delay:
  -6s;

}


@keyframes blobMove {

  0%,
  100% {

    transform:
    translate(0,0);

  }


  50% {

    transform:
    translate(
      100px,
      70px
    );

  }

}


/* =========================
   GALAXY BACKGROUND
========================= */

.galaxy-stars {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -8;

  opacity: 0;

  transition:
  opacity .6s ease;

  background-image:

  radial-gradient(
    circle,
    white 1px,
    transparent 1.5px
  ),

  radial-gradient(
    circle,
    rgba(180,200,255,.8) 1px,
    transparent 1.5px
  ),

  radial-gradient(
    circle,
    rgba(255,255,255,.6) 1px,
    transparent 1.5px
  );

  background-size:

  90px 90px,

  140px 140px,

  200px 200px;

  animation:
  starsMove
  20s
  linear
  infinite;

}


body.galaxy-theme
.galaxy-stars {

  opacity: 1;

}


@keyframes starsMove {

  from {

    background-position:

    0 0,

    20px 40px,

    50px 80px;

  }


  to {

    background-position:

    90px 120px,

    160px 180px,

    250px 220px;

  }

}


/* =========================
   SPARKLES
========================= */

.sparkles {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -7;

  opacity: 0;

  transition:
  opacity .6s ease;

}


body.galaxy-theme
.sparkles {

  opacity: 1;

}


.sparkle {

  position: absolute;

  width: 4px;

  height: 4px;

  background: white;

  border-radius: 50%;

  box-shadow:

  0 0 8px white,

  0 0 18px
  rgba(150,180,255,.8);

  animation:

  sparkle
  3s
  ease-in-out
  infinite;

}


.sparkle:nth-child(1) {

  top: 15%;

  left: 12%;

}


.sparkle:nth-child(2) {

  top: 30%;

  left: 80%;

  animation-delay: 1s;

}


.sparkle:nth-child(3) {

  top: 70%;

  left: 18%;

  animation-delay: 2s;

}


.sparkle:nth-child(4) {

  top: 55%;

  left: 90%;

  animation-delay: .5s;

}


.sparkle:nth-child(5) {

  top: 80%;

  left: 60%;

  animation-delay: 1.5s;

}


.sparkle:nth-child(6) {

  top: 10%;

  left: 50%;

  animation-delay: 2.5s;

}


@keyframes sparkle {

  0%,
  100% {

    transform:
    scale(.5);

    opacity: .3;

  }


  50% {

    transform:
    scale(2);

    opacity: 1;

  }

}


/* =========================
   SATURN
========================= */

.saturn {

  position: fixed;

  right: -80px;

  bottom: -65px;

  width: 290px;

  height: 290px;

  pointer-events: none;

  z-index: -5;

  opacity: 0;

  transform:
  translateY(40px);

  transition:

  opacity .8s ease,

  transform .8s ease;

}


body.galaxy-theme
.saturn {

  opacity: .95;

  transform:
  translateY(0);

}


/* RING BACK */

.saturn-ring-back {

  position: absolute;

  width: 290px;

  height: 95px;

  left: 0;

  top: 95px;

  border-radius: 50%;

  border:

  17px solid
  rgba(205,180,135,.7);

  transform:
  rotate(-18deg);

  animation:
  ringMove
  7s
  ease-in-out
  infinite;

}


/* PLANET */

.saturn-planet {

  position: absolute;

  width: 185px;

  height: 185px;

  left: 52px;

  top: 52px;

  border-radius: 50%;

  background:

  radial-gradient(
    circle at 35% 30%,

    #f4d7a1 0%,

    #d4a365 30%,

    #9b6739 60%,

    #3d2414 100%
  );

  box-shadow:

  inset
  -25px
  -20px
  35px
  rgba(0,0,0,.45),

  0
  0
  60px
  rgba(195,140,80,.2);

}


/* RING FRONT */

.saturn-ring-front {

  position: absolute;

  width: 290px;

  height: 95px;

  left: 0;

  top: 95px;

  border-radius: 50%;

  border:

  17px solid
  rgba(230,205,160,.8);

  border-top-color:

  transparent;

  border-left-color:

  rgba(230,205,160,.45);

  transform:
  rotate(-18deg);

  animation:
  ringMove
  7s
  ease-in-out
  infinite;

}


@keyframes ringMove {

  0%,
  100% {

    transform:
    rotate(-18deg)
    scaleX(1);

  }


  25% {

    transform:
    rotate(-15deg)
    scaleX(.94);

  }


  50% {

    transform:
    rotate(-18deg)
    scaleX(.86);

  }


  75% {

    transform:
    rotate(-21deg)
    scaleX(.94);

  }

}


/* =========================
   SPIDER THEME
========================= */

.spider-web {

  position: fixed;

  pointer-events: none;

  z-index: -3;

  opacity: 0;

  transition:
  opacity .6s ease;

  width: 250px;

  height: 250px;

}


body.spider-theme
.spider-web {

  opacity: .45;

}


.web-left {

  top: 0;

  left: 0;

  border-radius:
  0 0 100% 0;

  background:

  repeating-radial-gradient(

    circle at top left,

    transparent 0px,

    transparent 18px,

    rgba(180,30,40,.3)
    19px,

    transparent 21px

  );

  border-right:

  1px solid
  rgba(180,30,40,.25);

  border-bottom:

  1px solid
  rgba(180,30,40,.25);

}


.web-right {

  right: 0;

  bottom: 0;

  border-radius:
  100% 0 0 0;

  background:

  repeating-radial-gradient(

    circle at bottom right,

    transparent 0px,

    transparent 18px,

    rgba(180,30,40,.3)
    19px,

    transparent 21px

  );

  border-left:

  1px solid
  rgba(180,30,40,.25);

  border-top:

  1px solid
  rgba(180,30,40,.25);

}


/* =========================
   OCEAN THEME
========================= */

.ocean-waves {

  position: fixed;

  inset: 0;

  overflow: hidden;

  pointer-events: none;

  z-index: -9;

  opacity: 0;

  transition:
  opacity .7s ease;

}


body.ocean-theme
.ocean-waves {

  opacity: 1;

}


.ocean-wave {

  position: absolute;

  width: 180%;

  height: 300px;

  left: -40%;

  border-radius: 45%;

  background:

  rgba(
    0,
    229,
    255,
    .08
  );

  filter:
  blur(20px);

  animation:
  oceanMove
  12s
  ease-in-out
  infinite;

}


.wave1 {

  bottom: -150px;

}


.wave2 {

  bottom: -180px;

  background:
  rgba(0,150,255,.1);

  animation-delay:
  -5s;

}


.wave3 {

  bottom: -210px;

  background:
  rgba(0,255,220,.06);

  animation-delay:
  -8s;

}


@keyframes oceanMove {

  0%,
  100% {

    transform:
    translateX(-5%)
    rotate(0deg);

  }


  50% {

    transform:
    translateX(5%)
    rotate(3deg);

  }

}


body.ocean-theme {

  --accent: #00e5ff;

  --accent2: #0077ff;

  --accent-rgb: 0, 229, 255;

  --bg: #02141c;

  background:

  radial-gradient(
    circle at top left,
    rgba(0,229,255,.2),
    transparent 40%
  ),

  radial-gradient(
    circle at bottom right,
    rgba(0,119,255,.18),
    transparent 40%
  ),

  #02141c;

}


/* =========================
   OCEAN BUBBLES
========================= */

.ocean-bubbles {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -6;

  opacity: 0;

  transition:
  opacity .6s ease;

}


body.ocean-theme
.ocean-bubbles {

  opacity: 1;

}


.bubble {

  position: absolute;

  width: 10px;

  height: 10px;

  border-radius: 50%;

  border:

  1px solid
  rgba(150,255,255,.45);

  box-shadow:

  0 0 15px
  rgba(0,229,255,.2);

  animation:
  bubbleRise
  8s
  linear
  infinite;

}


.bubble:nth-child(1) {

  left: 10%;
  bottom: -20px;

}


.bubble:nth-child(2) {

  left: 25%;
  bottom: -40px;

  width: 6px;
  height: 6px;

  animation-delay: 2s;

}


.bubble:nth-child(3) {

  left: 45%;
  bottom: -30px;

  animation-delay: 4s;

}


.bubble:nth-child(4) {

  left: 70%;
  bottom: -50px;

  width: 14px;
  height: 14px;

  animation-delay: 1s;

}


@keyframes bubbleRise {

  0% {

    transform:
    translateY(0)
    translateX(0);

    opacity: 0;

  }


  10% {

    opacity: 1;

  }


  90% {

    opacity: 1;

  }


  100% {

    transform:
    translateY(-100vh)
    translateX(20px);

    opacity: 0;

  }

}


/* =========================
   MAIN STYLES
========================= */

main {

  position: relative;

  z-index: 1;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  min-height: 100vh;

  padding: 60px 20px;

  text-align: center;

}


.tag {

  font-size: 14px;

  color: var(--muted);

  margin-bottom: 20px;

  text-transform: uppercase;

  letter-spacing: 1.2px;

}


.title {

  font-size: 56px;

  font-weight: 900;

  margin-bottom: 15px;

  background:

  linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
  );

  -webkit-background-clip: text;

  -webkit-text-fill-color: transparent;

  background-clip: text;

}


.title .download {

  display: block;

  font-size: 48px;

}


.title .videos {

  display: block;

  font-size: 48px;

}


.description {

  font-size: 18px;

  color: var(--muted);

  margin-bottom: 45px;

  max-width: 600px;

}


.converter {

  width: 100%;

  max-width: 600px;

  padding: 40px;

  background:
  var(--glass);

  border:
  1px solid
  var(--border);

  border-radius: 16px;

  backdrop-filter: blur(10px);

  display: flex;

  flex-direction: column;

  gap: 20px;

}


/* =========================
   FORMAT SWITCH
========================= */

.format-switch {

  display: flex;

  gap: 12px;

  background:
  rgba(0, 0, 0, 0.3);

  padding: 6px;

  border-radius: 10px;

}


.format-btn {

  flex: 1;

  padding: 12px 16px;

  background: transparent;

  color: var(--text);

  border: none;

  border-radius: 8px;

  font-size: 14px;

  font-weight: 600;

  cursor: pointer;

  transition:

  all .3s ease;

}


.format-btn:hover {

  background:
  rgba(255, 255, 255, 0.05);

}


.format-btn.active {

  background:

  linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
  );

  color: #fff;

  box-shadow:

  0 4px 15px
  rgba(var(--accent-rgb), 0.4);

}


/* =========================
   URL BOX
========================= */

.url-box {

  display: flex;

  gap: 12px;

  width: 100%;

}


.url-input {

  flex: 1;

  padding: 14px 16px;

  background:
  rgba(255, 255, 255, 0.03);

  border:
  1px solid
  var(--border);

  color: var(--text);

  border-radius: 10px;

  font-size: 15px;

  outline: none;

  transition:

  all .3s ease;

}


.url-input:focus {

  background:
  rgba(255, 255, 255, 0.06);

  border-color:
  var(--accent);

  box-shadow:

  0 0 12px
  rgba(var(--accent-rgb), 0.3);

}


.url-input::placeholder {

  color:
  rgba(var(--text), 0.4);

}


.download-btn {

  padding: 14px 28px;

  background:

  linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
  );

  color: #fff;

  border: none;

  border-radius: 10px;

  font-weight: 600;

  font-size: 14px;

  cursor: pointer;

  transition:

  all .3s ease;

  white-space: nowrap;

}


.download-btn:hover {

  transform: translateY(-2px);

  box-shadow:

  0 8px 20px
  rgba(var(--accent-rgb), 0.4);

}


.download-btn:active {

  transform: translateY(0);

}


.download-btn:disabled {

  opacity: .6;

  cursor: not-allowed;

}


/* =========================
   STATUS BOX
========================= */

.status-box {

  display: none;

  flex-direction: column;

  align-items: center;

  gap: 15px;

  padding: 20px;

  background:
  rgba(0, 0, 0, 0.2);

  border-radius: 10px;

  min-height: 80px;

}


.loader {

  display: none;

  width: 40px;

  height: 40px;

  border:

  3px solid
  rgba(var(--accent-rgb), 0.3);

  border-top-color:
  var(--accent);

  border-radius: 50%;

  animation:

  spin .6s
  linear
  infinite;

}


@keyframes spin {

  to {

    transform:
    rotate(360deg);

  }

}


.status-text {

  font-size: 14px;

  color: var(--muted);

}


/* =========================
   INFO
========================= */

.info {

  font-size: 13px;

  color:
  rgba(var(--text), 0.5);

  text-align: center;

}


/* =========================
   FOOTER
========================= */

footer {

  position: fixed;

  bottom: 20px;

  left: 50%;

  transform: translateX(-50%);

  font-size: 12px;

  color: var(--muted);

}


/* =========================
   MENU
========================= */

.menu-btn {

  background: none;

  border: none;

  font-size: 24px;

  cursor: pointer;

  color: var(--text);

}


nav {

  position: fixed;

  top: 0;

  left: 0;

  right: 0;

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 20px 30px;

  background:
  rgba(0, 0, 0, 0.5);

  backdrop-filter: blur(10px);

  border-bottom:

  1px solid
  var(--border);

  z-index: 100;

}


.logo {

  font-size: 18px;

  font-weight: 900;

  background:

  linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
  );

  -webkit-background-clip: text;

  -webkit-text-fill-color: transparent;

  background-clip: text;

}


.logo span {

  letter-spacing: 2px;

}


.side-menu {

  position: fixed;

  left: 0;

  top: 0;

  width: 250px;

  height: 100vh;

  background:
  rgba(0, 0, 0, 0.8);

  backdrop-filter: blur(10px);

  border-right:

  1px solid
  var(--border);

  z-index: 200;

  transform: translateX(-100%);

  transition:
  transform .3s ease;

  display: flex;

  flex-direction: column;

  padding: 80px 20px 20px;

  gap: 10px;

}


.side-menu.active {

  transform: translateX(0);

}


.menu-overlay {

  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, 0);

  z-index: 150;

  opacity: 0;

  pointer-events: none;

  transition:

  background .3s ease,

  opacity .3s ease;

}


.menu-overlay.active {

  background: rgba(0, 0, 0, 0.5);

  opacity: 1;

  pointer-events: auto;

}


.list-option {

  background: transparent;

  border: none;

  color: var(--text);

  padding: 12px 16px;

  border-radius: 8px;

  font-size: 14px;

  cursor: pointer;

  transition:
  all .3s ease;

  text-align: left;

}


.list-option:hover {

  background:
  rgba(var(--accent-rgb), 0.1);

}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

  main {

    padding: 80px 20px 60px;

  }


  .title {

    font-size: 40px;

  }


  .title .download,
  .title .videos {

    font-size: 36px;

  }


  .description {

    font-size: 16px;

    margin-bottom: 30px;

  }


  .converter {

    padding: 30px 20px;

  }


  .url-box {

    flex-direction: column;

  }


  .download-btn {

    width: 100%;

  }

}

</style>

</head>

<body>

<div class="background">

  <div class="blob blob1"></div>

  <div class="blob blob2"></div>

</div>

<div class="galaxy-stars"></div>

<div class="sparkles">

  <div class="sparkle"></div>

  <div class="sparkle"></div>

  <div class="sparkle"></div>

  <div class="sparkle"></div>

  <div class="sparkle"></div>

  <div class="sparkle"></div>

</div>

<div class="saturn">

  <div class="saturn-ring-back"></div>

  <div class="saturn-planet"></div>

  <div class="saturn-ring-front"></div>

</div>

<div class="ocean-waves">

  <div class="ocean-wave wave1"></div>

  <div class="ocean-wave wave2"></div>

  <div class="ocean-wave wave3"></div>

</div>

<div class="ocean-bubbles">

  <div class="bubble"></div>

  <div class="bubble"></div>

  <div class="bubble"></div>

  <div class="bubble"></div>

</div>

<div class="spider-web web-left"></div>

<div class="spider-web web-right"></div>

<!-- =====================
     MENU OVERLAY
===================== -->

<div
class="menu-overlay"
id="menuOverlay"
onclick="closeMenu()"
></div>

<!-- =====================
     SIDE MENU
===================== -->

<div
class="side-menu"
id="sideMenu"
>

  <div style="flex: 1;"></div>

  <button
  class="list-option"
  onclick="setTheme('ocean')"
  >
    🌊 Ocean Theme
  </button>

  <button
  class="list-option"
  onclick="setTheme('galaxy')"
  >
    🌌 Galaxy Theme
  </button>

  <button
  class="list-option"
  onclick="setTheme('spider')"
  >
    🕷️ Spider Theme
  </button>

  <button
  class="list-option"
  onclick="setTheme('dark')"
  >
    🌙 Dark Theme
  </button>

  <button
  class="list-option"
  onclick="setTheme('default')"
  >
    ✨ Default Theme
  </button>

</div>

</div>

<!-- =====================
     NAV
===================== -->

<nav>

  <div class="logo">
    VIDEO
    <span>EXTRACTOR</span>
  </div>

  <button
  class="menu-btn"
  onclick="openMenu()"
  >
    ☰
  </button>

</nav>


<!-- =====================
     MAIN
===================== -->

<main>

  <div class="tag">
    ⚡ Personal Media Converter
  </div>


  <h1 class="title">

    <span class="download">
      Download
    </span>

    <span class="videos">
      Videos
    </span>

  </h1>


  <p class="description">

    Download YouTube videos, direct media files or convert
    your media into MP3 audio.

  </p>


  <!-- =====================
       CONVERTER
  ===================== -->

  <div class="converter">


    <!-- FORMAT -->

    <div
    class="format-switch"
    >

      <button

      class="format-btn active"

      id="mp4Btn"

      onclick="setFormat('mp4')"

      >

        🎬 MP4

      </button>


      <button

      class="format-btn"

      id="mp3Btn"

      onclick="setFormat('mp3')"

      >

        🎵 MP3

      </button>

    </div>


    <!-- URL -->

    <div
    class="url-box"
    >

      <input

      id="urlInput"

      class="url-input"

      type="url"

      placeholder="Paste YouTube or media URL..."

      >


      <button

      class="download-btn"

      id="downloadBtn"

      onclick="downloadMedia()"

      >

        Download

      </button>

    </div>


    <!-- STATUS -->

    <div

    id="statusBox"

    class="status-box"

    >

      <div

      class="loader"

      id="loader"

      ></div>


      <div

      id="statusText"

      class="status-text"

      >

        Preparing...

      </div>

    </div>


    <div

    class="info"

    id="infoText"

    >

      Supports YouTube, TikTok, Instagram, and direct media file URLs.

    </div>

  </div>

</main>

<script>

/* ======================
   MENU
====================== */

function openMenu() {

  document
    .getElementById("sideMenu")
    .classList
    .add("active");


  document
    .getElementById("menuOverlay")
    .classList
    .add("active");

}


function closeMenu() {

  document
    .getElementById("sideMenu")
    .classList
    .remove("active");


  document
    .getElementById("menuOverlay")
    .classList
    .remove("active");

}


/* ======================
   THEME
====================== */

function setTheme(theme) {

  const body = document.body;

  body.classList.remove(
    "ocean-theme",
    "galaxy-theme",
    "spider-theme",
    "dark-theme"
  );

  if (theme === "ocean") {

    body.classList.add("ocean-theme");

  } else if (theme === "galaxy") {

    body.classList.add("galaxy-theme");

  } else if (theme === "spider") {

    body.classList.add("spider-theme");

  } else if (theme === "dark") {

    body.classList.add("dark-theme");

  }

  closeMenu();

}


/* ======================
   FORMAT
====================== */

let selectedFormat = "mp4";


function setFormat(format) {

  selectedFormat = format;

  const mp4Btn =
    document.getElementById("mp4Btn");

  const mp3Btn =
    document.getElementById("mp3Btn");

  const input =
    document.getElementById("urlInput");

  const button =
    document.getElementById("downloadBtn");

  const info =
    document.getElementById("infoText");


  if (format === "mp3") {

    mp3Btn.classList.add("active");

    mp4Btn.classList.remove("active");


    input.placeholder =
      "Paste YouTube or media URL...";


    button.innerText =
      "Convert to MP3";


    info.innerText =
      "Audio will be extracted and converted to MP3.";

  }


  else {

    input.placeholder =
      "Paste YouTube or media URL...";


    button.innerText =
      "Download";


    info.innerText =
      "Supports YouTube, TikTok, Instagram, and direct media file URLs.";

  }

}


/* ======================
   DOWNLOAD
====================== */
async function downloadMedia() {

  const url =
    document
      .getElementById("urlInput")
      .value
      .trim();


  if (!url) {

    alert(
      "Please paste a media URL."
    );

    return;

  }


  const statusBox =
    document.getElementById(
      "statusBox"
    );


  const statusText =
    document.getElementById(
      "statusText"
    );


  const loader =
    document.getElementById(
      "loader"
    );


  const button =
    document.getElementById(
      "downloadBtn"
    );


  statusBox.style.display =
    "flex";


  loader.style.display =
    "block";


  statusText.innerText =

    selectedFormat === "mp3"

    ? "Converting media to MP3..."

    : "Downloading video...";


  button.disabled = true;


  button.style.opacity =
    ".6";


  try {

    /* PYTHON FLASK BACKEND */

    const backendURL = 
      window.location.origin;


    /* SELECT API */

    const endpoint =

      selectedFormat === "mp3"

      ? backendURL +
        "/api/convert/mp3"

      : backendURL +
        "/api/download";


    /* SEND REQUEST */

    const response =
      await fetch(

        endpoint,

        {

          method: "POST",


          headers: {

            "Content-Type":
            "application/json"

          },


          body:

          JSON.stringify({

            url: url

          })

        }

      );


    /* ERROR CHECK */

    if (!response.ok) {

      const data =
        await response
          .json()
          .catch(
            () => null
          );


      throw new Error(

        data?.error ||

        "Request failed."

      );

    }


    statusText.innerText =

      selectedFormat === "mp3"

      ? "Preparing MP3..."

      : "Preparing file...";


    /* GET FILE */

    const blob =
      await response.blob();


    const objectURL =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href =
      objectURL;


    /* FILE NAME */

    link.download =

      selectedFormat === "mp3"

      ? "audio.mp3"

      : "video.mp4";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
      objectURL
    );


    loader.style.display =
      "none";


    statusText.innerText =

      selectedFormat === "mp3"

      ? "MP3 download started! ✓"

      : "Download started! ✓";

  }


  catch (error) {

    console.error(error);


    loader.style.display =
      "none";


    statusText.innerText =

      "Error: " +
      error.message;

  }


  finally {

    button.disabled =
      false;


    button.style.opacity =
      "1";

  }

}

</script>

</body>

</html>
