<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Video Extractor</title>


<style>

/* =========================
   ROOT
========================= */

:root {

  --accent: #8b5cf6;
  --accent2: #4f46e5;
  --accent-rgb: 139, 92, 246;

  --bg: #07070d;

  --text: #f8f8ff;

  --muted: #aaaabc;

  --glass:
  rgba(255,255,255,0.06);

  --border:
  rgba(255,255,255,0.12);

}


/* =========================
   RESET
========================= */

* {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

  font-family:
  Arial,
  sans-serif;

}


html {

  scroll-behavior: smooth;

}


body {

  min-height: 100vh;

  color:
  var(--text);

  background:

  radial-gradient(
    circle at top left,
    rgba(var(--accent-rgb), .18),
    transparent 35%
  ),

  var(--bg);

  transition:

  background .6s ease,

  color .4s ease;

  overflow-x: hidden;

}


/* =========================
   BACKGROUND
========================= */

.background {

  position: fixed;

  inset: 0;

  overflow: hidden;

  z-index: -10;

  pointer-events: none;

}


.blob {

  position: absolute;

  width: 450px;

  height: 450px;

  border-radius: 50%;

  background:
  var(--accent);

  filter:
  blur(140px);

  opacity: .18;

  animation:
  blobMove
  14s
  ease-in-out
  infinite;

}


.blob1 {

  top: -180px;

  left: -180px;

}


.blob2 {

  right: -180px;

  bottom: -180px;

  background:
  var(--accent2);

  animation-delay:
  -6s;

}


@keyframes blobMove {

  0%,
  100% {

    transform:
    translate(0,0);

  }


  50% {

    transform:
    translate(
      100px,
      70px
    );

  }

}


/* =========================
   GALAXY BACKGROUND
========================= */

.galaxy-stars {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -8;

  opacity: 0;

  transition:
  opacity .6s ease;

  background-image:

  radial-gradient(
    circle,
    white 1px,
    transparent 1.5px
  ),

  radial-gradient(
    circle,
    rgba(180,200,255,.8) 1px,
    transparent 1.5px
  ),

  radial-gradient(
    circle,
    rgba(255,255,255,.6) 1px,
    transparent 1.5px
  );

  background-size:

  90px 90px,

  140px 140px,

  200px 200px;

  animation:
  starsMove
  20s
  linear
  infinite;

}


body.galaxy-theme
.galaxy-stars {

  opacity: 1;

}


@keyframes starsMove {

  from {

    background-position:

    0 0,

    20px 40px,

    50px 80px;

  }


  to {

    background-position:

    90px 120px,

    160px 180px,

    250px 220px;

  }

}


/* =========================
   SPARKLES
========================= */

.sparkles {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -7;

  opacity: 0;

  transition:
  opacity .6s ease;

}


body.galaxy-theme
.sparkles {

  opacity: 1;

}


.sparkle {

  position: absolute;

  width: 4px;

  height: 4px;

  background: white;

  border-radius: 50%;

  box-shadow:

  0 0 8px white,

  0 0 18px
  rgba(150,180,255,.8);

  animation:

  sparkle
  3s
  ease-in-out
  infinite;

}


.sparkle:nth-child(1) {

  top: 15%;

  left: 12%;

}


.sparkle:nth-child(2) {

  top: 30%;

  left: 80%;

  animation-delay: 1s;

}


.sparkle:nth-child(3) {

  top: 70%;

  left: 18%;

  animation-delay: 2s;

}


.sparkle:nth-child(4) {

  top: 55%;

  left: 90%;

  animation-delay: .5s;

}


.sparkle:nth-child(5) {

  top: 80%;

  left: 60%;

  animation-delay: 1.5s;

}


.sparkle:nth-child(6) {

  top: 10%;

  left: 50%;

  animation-delay: 2.5s;

}


@keyframes sparkle {

  0%,
  100% {

    transform:
    scale(.5);

    opacity: .3;

  }


  50% {

    transform:
    scale(2);

    opacity: 1;

  }

}


/* =========================
   SATURN
========================= */

.saturn {

  position: fixed;

  right: -80px;

  bottom: -65px;

  width: 290px;

  height: 290px;

  pointer-events: none;

  z-index: -5;

  opacity: 0;

  transform:
  translateY(40px);

  transition:

  opacity .8s ease,

  transform .8s ease;

}


body.galaxy-theme
.saturn {

  opacity: .95;

  transform:
  translateY(0);

}


/* RING BACK */

.saturn-ring-back {

  position: absolute;

  width: 290px;

  height: 95px;

  left: 0;

  top: 95px;

  border-radius: 50%;

  border:

  17px solid
  rgba(205,180,135,.7);

  transform:
  rotate(-18deg);

  animation:
  ringMove
  7s
  ease-in-out
  infinite;

}


/* PLANET */

.saturn-planet {

  position: absolute;

  width: 185px;

  height: 185px;

  left: 52px;

  top: 52px;

  border-radius: 50%;

  background:

  radial-gradient(
    circle at 35% 30%,

    #f4d7a1 0%,

    #d4a365 30%,

    #9b6739 60%,

    #3d2414 100%
  );

  box-shadow:

  inset
  -25px
  -20px
  35px
  rgba(0,0,0,.45),

  0
  0
  60px
  rgba(195,140,80,.2);

}


/* RING FRONT */

.saturn-ring-front {

  position: absolute;

  width: 290px;

  height: 95px;

  left: 0;

  top: 95px;

  border-radius: 50%;

  border:

  17px solid
  rgba(230,205,160,.8);

  border-top-color:

  transparent;

  border-left-color:

  rgba(230,205,160,.45);

  transform:
  rotate(-18deg);

  animation:
  ringMove
  7s
  ease-in-out
  infinite;

}


@keyframes ringMove {

  0%,
  100% {

    transform:
    rotate(-18deg)
    scaleX(1);

  }


  25% {

    transform:
    rotate(-15deg)
    scaleX(.94);

  }


  50% {

    transform:
    rotate(-18deg)
    scaleX(.86);

  }


  75% {

    transform:
    rotate(-21deg)
    scaleX(.94);

  }

}


/* =========================
   SPIDER THEME
========================= */

.spider-web {

  position: fixed;

  pointer-events: none;

  z-index: -3;

  opacity: 0;

  transition:
  opacity .6s ease;

  width: 250px;

  height: 250px;

}


body.spider-theme
.spider-web {

  opacity: .45;

}


.web-left {

  top: 0;

  left: 0;

  border-radius:
  0 0 100% 0;

  background:

  repeating-radial-gradient(

    circle at top left,

    transparent 0px,

    transparent 18px,

    rgba(180,30,40,.3)
    19px,

    transparent 21px

  );

  border-right:

  1px solid
  rgba(180,30,40,.25);

  border-bottom:

  1px solid
  rgba(180,30,40,.25);

}


.web-right {

  right: 0;

  bottom: 0;

  border-radius:
  100% 0 0 0;

  background:

  repeating-radial-gradient(

    circle at bottom right,

    transparent 0px,

    transparent 18px,

    rgba(180,30,40,.3)
    19px,

    transparent 21px

  );

  border-left:

  1px solid
  rgba(180,30,40,.25);

  border-top:

  1px solid
  rgba(180,30,40,.25);

}


/* =========================
   OCEAN THEME
========================= */

.ocean-waves {

  position: fixed;

  inset: 0;

  overflow: hidden;

  pointer-events: none;

  z-index: -9;

  opacity: 0;

  transition:
  opacity .7s ease;

}


body.ocean-theme
.ocean-waves {

  opacity: 1;

}


.ocean-wave {

  position: absolute;

  width: 180%;

  height: 300px;

  left: -40%;

  border-radius: 45%;

  background:

  rgba(
    0,
    229,
    255,
    .08
  );

  filter:
  blur(20px);

  animation:
  oceanMove
  12s
  ease-in-out
  infinite;

}


.wave1 {

  bottom: -150px;

}


.wave2 {

  bottom: -180px;

  background:
  rgba(0,150,255,.1);

  animation-delay:
  -5s;

}


.wave3 {

  bottom: -210px;

  background:
  rgba(0,255,220,.06);

  animation-delay:
  -8s;

}


@keyframes oceanMove {

  0%,
  100% {

    transform:
    translateX(-5%)
    rotate(0deg);

  }


  50% {

    transform:
    translateX(5%)
    rotate(3deg);

  }

}


body.ocean-theme {

  --accent: #00e5ff;

  --accent2: #0077ff;

  --accent-rgb: 0, 229, 255;

  --bg: #02141c;

  background:

  radial-gradient(
    circle at top left,
    rgba(0,229,255,.2),
    transparent 40%
  ),

  radial-gradient(
    circle at bottom right,
    rgba(0,119,255,.18),
    transparent 40%
  ),

  #02141c;

}


/* =========================
   OCEAN BUBBLES
========================= */

.ocean-bubbles {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -6;

  opacity: 0;

  transition:
  opacity .6s ease;

}


body.ocean-theme
.ocean-bubbles {

  opacity: 1;

}


.bubble {

  position: absolute;

  width: 10px;

  height: 10px;

  border-radius: 50%;

  border:

  1px solid
  rgba(150,255,255,.45);

  box-shadow:

  0 0 15px
  rgba(0,229,255,.2);

  animation:
  bubbleRise
  8s
  linear
  infinite;

}


.bubble:nth-child(1) {

  left: 10%;
  bottom: -20px;

}


.bubble:nth-child(2) {

  left: 25%;
  bottom: -40px;

  width: 6px;
  height: 6px;

  animation-delay: 2s;

}


.bubble:nth-child(3) {

  left: 45%;
  bottom: -30px;

  animation-delay: 4s;

}


.bubble:nth-child(4) {

  left: 70%;
  bottom: -50px;

  width: 14px;
  height: 14px;

  animation-delay: 1s;

}


.bubble:nth-child(5) {

  left: 88%;
  bottom: -30px;

  width: 7px;
  height: 7px;

  animation-delay: 5s;

}


@keyframes bubbleRise {

  from {

    transform:
    translateY(0);

    opacity: 0;

  }


  20% {

    opacity: .7;

  }


  80% {

    opacity: .4;

  }


  to {

    transform:
    translateY(-110vh);

    opacity: 0;

  }

}
  /* =========================
   SPIDER
========================= */

.spider-container {

  position: fixed;

  top: -130px;

  right: 8%;

  z-index: 3;

  pointer-events: none;

  opacity: 0;

  transition:
  opacity .6s ease;

}


body.spider-theme
.spider-container {

  opacity: 1;

  animation:

  spiderDrop
  8s
  ease-in-out
  infinite;

}


.spider-thread {

  width: 1px;

  height: 140px;

  margin: auto;

  background:

  linear-gradient(

    transparent,

    rgba(255,255,255,.5)

  );

}


.spider {

  width: 35px;

  height: 42px;

  margin: auto;

  position: relative;

}


.spider-body {

  position: absolute;

  width: 22px;

  height: 28px;

  left: 7px;

  top: 7px;

  border-radius: 50%;

  background:

  radial-gradient(

    circle at 35% 30%,

    #d61f2b,

    #49050a 70%

  );

  box-shadow:

  0 0 15px
  rgba(180,10,20,.5);

}


.spider-body::before {

  content: "";

  position: absolute;

  width: 10px;

  height: 10px;

  background: #111;

  border-radius: 50%;

  left: 6px;

  top: -6px;

}


.spider-leg {

  position: absolute;

  width: 18px;

  height: 2px;

  background: #111;

  transform-origin: left;

}


.leg1 {

  top: 13px;

  left: 2px;

  transform:
  rotate(-30deg);

}


.leg2 {

  top: 19px;

  left: 1px;

  transform:
  rotate(15deg);

}


.leg3 {

  top: 13px;

  right: 2px;

  transform:
  rotate(30deg);

}


.leg4 {

  top: 19px;

  right: 1px;

  transform:
  rotate(-15deg);

}


@keyframes spiderDrop {

  0% {

    transform:
    translateY(-40px);

  }


  50% {

    transform:
    translateY(220px);

  }


  100% {

    transform:
    translateY(-40px);

  }

}


/* =========================
   NAV
========================= */

nav {

  width:
  min(1100px,90%);

  margin:
  20px auto;

  padding:
  16px 20px;

  display: flex;

  justify-content:
  space-between;

  align-items:
  center;

  background:
  var(--glass);

  backdrop-filter:
  blur(25px);

  -webkit-backdrop-filter:
  blur(25px);

  border:

  1px solid
  var(--border);

  border-radius:
  22px;

  animation:
  navEnter
  .8s
  ease;

}


@keyframes navEnter {

  from {

    opacity: 0;

    transform:
    translateY(-20px);

  }


  to {

    opacity: 1;

    transform:
    translateY(0);

  }

}


.logo {

  font-size: 18px;

  font-weight: 700;

  letter-spacing: 2px;

}


.logo span {

  color:
  var(--accent);

}


/* =========================
   MENU BUTTON
========================= */

.menu-btn {

  width: 46px;

  height: 46px;

  border-radius: 14px;

  border:

  1px solid
  var(--border);

  background:
  rgba(255,255,255,.05);

  color: white;

  font-size: 23px;

  cursor: pointer;

  transition: .3s;

}


.menu-btn:hover {

  transform:
  scale(1.07);

  background:

  rgba(
    var(--accent-rgb),
    .18
  );

  border-color:
  var(--accent);

}


/* =========================
   OVERLAY
========================= */

.menu-overlay {

  position: fixed;

  inset: 0;

  background:
  rgba(0,0,0,.45);

  backdrop-filter:
  blur(5px);

  opacity: 0;

  pointer-events: none;

  transition: .3s;

  z-index: 20;

}


.menu-overlay.active {

  opacity: 1;

  pointer-events: auto;

}


/* =========================
   SIDE MENU
========================= */

.side-menu {

  position: fixed;

  top: 0;

  right: -380px;

  width:
  min(360px,90%);

  height: 100vh;

  padding: 25px;

  background:
  rgba(15,15,25,.88);

  backdrop-filter:
  blur(30px);

  border-left:

  1px solid
  var(--border);

  z-index: 30;

  transition:

  .4s
  cubic-bezier(
    .2,
    .8,
    .2,
    1
  );

  overflow-y: auto;

}


.side-menu.active {

  right: 0;

}


.menu-header {

  display: flex;

  justify-content:
  space-between;

  align-items:
  center;

  margin-bottom: 30px;

}


.close-btn,
.back-btn {

  width: 42px;

  height: 42px;

  border-radius: 12px;

  border:

  1px solid
  var(--border);

  background:
  transparent;

  color: white;

  font-size: 20px;

  cursor: pointer;

}


/* =========================
   MENU PAGES
========================= */

.menu-page {

  display: none;

  animation:
  pageEnter
  .3s
  ease;

}


.menu-page.active {

  display: block;

}


@keyframes pageEnter {

  from {

    opacity: 0;

    transform:
    translateX(20px);

  }


  to {

    opacity: 1;

    transform:
    translateX(0);

  }

}


.settings-option {

  width: 100%;

  padding: 18px;

  margin-bottom: 12px;

  display: flex;

  justify-content:
  space-between;

  align-items:
  center;

  border-radius: 16px;

  border:

  1px solid
  var(--border);

  background:
  rgba(255,255,255,.05);

  color: white;

  font-size: 16px;

  cursor: pointer;

  transition: .3s;

}


.settings-option:hover {

  transform:
  translateX(5px);

  border-color:
  var(--accent);

}


.page-header {

  display: flex;

  align-items: center;

  gap: 15px;

  margin-bottom: 25px;

}


.option-list {

  display: flex;

  flex-direction: column;

  gap: 10px;

}


.list-option {

  width: 100%;

  padding: 17px;

  display: flex;

  align-items: center;

  gap: 14px;

  border-radius: 15px;

  border:

  1px solid
  var(--border);

  background:
  rgba(255,255,255,.05);

  color: white;

  font-size: 16px;

  cursor: pointer;

  transition: .3s;

}


.list-option:hover {

  transform:
  translateX(5px);

  border-color:
  var(--accent);

}


.list-dot {

  width: 18px;

  height: 18px;

  border-radius: 50%;

}


.purple {
  background: #8b5cf6;
}

.red {
  background: #ef4444;
}

.blue {
  background: #3b82f6;
}

.green {
  background: #22c55e;
}

.pink {
  background: #ec4899;
}

.cyber {
  background: #00e5ff;
}

.orange {
  background: #f97316;
}

.gold {
  background: #eab308;
}


/* =========================
   MAIN
========================= */

main {

  width:
  min(850px,90%);

  margin:
  80px auto;

  text-align: center;

}


/* =========================
   TAG
========================= */

.tag {

  display:
  inline-flex;

  align-items:
  center;

  gap: 8px;

  padding:
  10px 18px;

  border-radius:
  30px;

  background:
  var(--glass);

  border:

  1px solid
  var(--border);

  color:
  var(--accent);

  animation:
  fadeUp
  .7s
  ease;

}


/* =========================
   TITLE
========================= */

.title {

  margin:
  28px 0 18px;

  font-size:
  clamp(
    55px,
    10vw,
    100px
  );

  line-height: .9;

  letter-spacing:
  -4px;

  animation:

  titleEnter
  1s
  cubic-bezier(
    .2,
    .8,
    .2,
    1
  );

}


.title .download {

  display: block;

  color: white;

}


.title .videos {

  display: block;

  margin-top: 10px;

  background:

  linear-gradient(

    135deg,

    var(--accent),

    var(--accent2)

  );

  -webkit-background-clip:
  text;

  color:
  transparent;

}


@keyframes titleEnter {

  from {

    opacity: 0;

    transform:

    translateY(40px)

    scale(.95);

  }


  to {

    opacity: 1;

    transform:

    translateY(0)

    scale(1);

  }

}


@keyframes fadeUp {

  from {

    opacity: 0;

    transform:
    translateY(20px);

  }


  to {

    opacity: 1;

    transform:
    translateY(0);

  }

}


.description {

  color:
  var(--muted);

  line-height: 1.7;

  font-size: 17px;

}


/* =========================
   CONVERTER
========================= */

.converter {

  margin-top: 50px;

  padding: 30px;

  background:

  linear-gradient(

    145deg,

    rgba(255,255,255,.09),

    rgba(255,255,255,.035)

  );

  backdrop-filter:
  blur(35px);

  border:

  1px solid
  var(--border);

  border-radius:
  30px;

  box-shadow:

  0
  25px
  80px
  rgba(0,0,0,.25);

}


/* =========================
   FORMAT SWITCH
========================= */

.format-switch {

  display: flex;

  gap: 10px;

  padding: 7px;

  width: fit-content;

  margin:
  0 auto 25px;

  border-radius:
  18px;

  background:
  rgba(0,0,0,.2);

  border:

  1px solid
  var(--border);

}


.format-btn {

  border: none;

  background:
  transparent;

  color:
  var(--muted);

  padding:
  13px 24px;

  border-radius:
  13px;

  font-size: 16px;

  cursor: pointer;

  transition: .35s;

}


.format-btn.active {

  color: white;

  background:

  linear-gradient(

    135deg,

    var(--accent),

    var(--accent2)

  );

  box-shadow:

  0
  8px
  30px

  rgba(
    var(--accent-rgb),
    .3
  );

}


/* =========================
   URL BOX
========================= */

.url-box {

  display: flex;

  gap: 12px;

}


.url-input {

  flex: 1;

  padding: 18px;

  border-radius:
  16px;

  border:

  1px solid
  var(--border);

  background:
  rgba(255,255,255,.06);

  color: white;

  outline: none;

  font-size: 15px;

}


.url-input:focus {

  border-color:
  var(--accent);

  box-shadow:

  0
  0
  0
  4px

  rgba(
    var(--accent-rgb),
    .1
  );

}


/* =========================
   DOWNLOAD BUTTON
========================= */

.download-btn {

  min-width: 150px;

  padding:
  18px 25px;

  border: none;

  border-radius:
  16px;

  background:

  linear-gradient(

    135deg,

    var(--accent),

    var(--accent2)

  );

  background-size:
  200% 200%;

  animation:

  buttonBlend

<script>

/* ======================
   MENU
====================== */

function openMenu() {

  document
    .getElementById("sideMenu")
    .classList
    .add("active");


  document
    .getElementById("menuOverlay")
    .classList
    .add("active");

}


function closeMenu() {

  document
    .getElementById("sideMenu")
    .classList
    .remove("active");


  document
    .getElementById("menuOverlay")
    .classList
    .remove("active");

}


/* ======================
   MENU PAGES
====================== */

function openPage(pageId) {

  document
    .querySelectorAll(".menu-page")
    .forEach(function(page) {

      page
        .classList
        .remove("active");

    });


  document
    .getElementById(pageId)
    .classList
    .add("active");

}


function goBack() {

  document
    .querySelectorAll(".menu-page")
    .forEach(function(page) {

      page
        .classList
        .remove("active");

    });


  document
    .getElementById("mainSettings")
    .classList
    .add("active");

}


/* ======================
   FORMAT
====================== */

let selectedFormat = "mp4";


function setFormat(format) {

  selectedFormat = format;


  document
    .getElementById("mp4Btn")
    .classList
    .toggle(
      "active",
      format === "mp4"
    );


  document
    .getElementById("mp3Btn")
    .classList
    .toggle(
      "active",
      format === "mp3"
    );


  const input =
    document.getElementById(
      "urlInput"
    );


  const button =
    document.getElementById(
      "downloadBtn"
    );


  const info =
    document.getElementById(
      "infoText"
    );


  if (format === "mp3") {

    input.placeholder =
      "Paste direct video/audio URL...";


    button.innerText =
      "Convert to MP3";


    info.innerText =
      "Audio will be extracted and converted to MP3.";

  }


  else {

    input.placeholder =
      "Paste direct media URL...";


    button.innerText =
      "Download";


    info.innerText =
      "Supports publicly accessible direct media file URLs.";

  }

}


/* ======================
   DOWNLOAD
====================== */

async function downloadMedia() {

  const url =
    document
      .getElementById("urlInput")
      .value
      .trim();


  if (!url) {

    alert(
      "Please paste a media URL."
    );

    return;

  }


  const statusBox =
    document.getElementById(
      "statusBox"
    );


  const statusText =
    document.getElementById(
      "statusText"
    );


  const loader =
    document.getElementById(
      "loader"
    );


  const button =
    document.getElementById(
      "downloadBtn"
    );


  statusBox.style.display =
    "block";


  loader.style.display =
    "block";


  statusText.innerText =

    selectedFormat === "mp3"

    ? "Converting media to MP3..."

    : "Connecting to media server...";


  button.disabled = true;


  button.style.opacity =
    ".6";


  try {

    const endpoint =

      selectedFormat === "mp3"

      ? "/api/convert/mp3"

      : "/api/download";


    const response =
      await fetch(

        endpoint,

        {

          method: "POST",


          headers: {

            "Content-Type":
            "application/json"

          },


          body:

          JSON.stringify({

            url: url

          })

        }

      );


    if (!response.ok) {

      const data =

        await response
          .json()
          .catch(
            () => null
          );


      throw new Error(

        data?.error ||

        "Request failed."

      );

    }


    statusText.innerText =

      selectedFormat === "mp3"

      ? "Preparing MP3..."

      : "Preparing file...";


    const blob =
      await response.blob();


    const objectURL =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href =
      objectURL;


    link.download =

      selectedFormat === "mp3"

      ? "audio.mp3"

      : "media.mp4";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
      objectURL
    );


    loader.style.display =
      "none";


    statusText.innerText =

      selectedFormat === "mp3"

      ? "MP3 download started! ✓"

      : "Download started! ✓";

  }


  catch (error) {

    console.error(error);


    loader.style.display =
      "none";


    statusText.innerText =

      "Error: " +
      error.message;

  }


  finally {

    button.disabled =
      false;


    button.style.opacity =
      "1";

  }

}


/* ======================
   COLOURS
====================== */

function setColour(colour) {

  const colours = {

    purple: {

      c1: "#8b5cf6",

      c2: "#4f46e5",

      rgb: "139, 92, 246"

    },


    red: {

      c1: "#ef4444",

      c2: "#b91c1c",

      rgb: "239, 68, 68"

    },


    blue: {

      c1: "#3b82f6",

      c2: "#1d4ed8",

      rgb: "59, 130, 246"

    },


    green: {

      c1: "#22c55e",

      c2: "#15803d",

      rgb: "34, 197, 94"

    },


    pink: {

      c1: "#ec4899",

      c2: "#be185d",

      rgb: "236, 72, 153"

    },


    cyber: {

      c1: "#00e5ff",

      c2: "#0891b2",

      rgb: "0, 229, 255"

    },


    orange: {

      c1: "#f97316",

      c2: "#c2410c",

      rgb: "249, 115, 22"

    },


    gold: {

      c1: "#eab308",

      c2: "#a16207",

      rgb: "234, 179, 8"

    }

  };


  const picked =
    colours[colour];


  if (!picked) {

    return;

  }


  document
    .documentElement
    .style
    .setProperty(

      "--accent",

      picked.c1

    );


  document
    .documentElement
    .style
    .setProperty(

      "--accent2",

      picked.c2

    );


  document
    .documentElement
    .style
    .setProperty(

      "--accent-rgb",

      picked.rgb

    );


  /* SAVE COLOUR */

  localStorage.setItem(

    "colour",

    colour

  );


  /* Colour choose karne ke baad
     menu automatically close */

  closeMenu();

}


/* ======================
   THEMES
====================== */

function setTheme(theme) {

  /* REMOVE ALL THEMES */

  document.body.classList.remove(

    "galaxy-theme",

    "spider-theme",

    "ocean-theme",

    "dark-theme"

  );


  /* GALAXY */

  if (theme === "galaxy") {

    document.body.classList.add(
      "galaxy-theme"
    );

  }


  /* SPIDER */

  else if (theme === "spider") {

    document.body.classList.add(
      "spider-theme"
    );

  }


  /* OCEAN */

  else if (theme === "ocean") {

    document.body.classList.add(
      "ocean-theme"
    );

  }


  /* DARK */

  else if (theme === "dark") {

    document.body.classList.add(
      "dark-theme"
    );

  }


  /* DEFAULT */

  else if (theme === "default") {

    document.body.style.removeProperty(
      "--accent"
    );


    document.body.style.removeProperty(
      "--accent2"
    );


    document.body.style.removeProperty(
      "--accent-rgb"
    );

  }


  /* SAVE THEME */

  localStorage.setItem(

    "websiteTheme",

    theme

  );


  closeMenu();

}


/* ======================
   LOAD SAVED SETTINGS
====================== */

const savedColour =

  localStorage.getItem(
    "colour"
  );


const savedWebsiteTheme =

  localStorage.getItem(
    "websiteTheme"
  );


/* LOAD THEME FIRST */

if (savedWebsiteTheme) {

  setTheme(
    savedWebsiteTheme
  );

}


/* LOAD COLOUR ONLY
   WHEN NO SPECIAL THEME */

if (

  savedColour &&

  (

    !savedWebsiteTheme ||

    savedWebsiteTheme === "default" ||

    savedWebsiteTheme === "dark"

  )

) {

  setColour(
    savedColour
  );

}

</script>
