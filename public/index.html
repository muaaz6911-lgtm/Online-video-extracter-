<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Extractor</title>

<style>
:root {
  --accent: #8b5cf6;
  --accent2: #2563eb;
  --bg: #080b14;
  --glass: rgba(255,255,255,.06);
  --border: rgba(255,255,255,.1);
  --muted: #a1a1b5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: white;
}

.background {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}

.blob {
  position: absolute;
  width: 450px;
  height: 450px;
  border-radius: 50%;
  background: var(--accent);
  opacity: .22;
  filter: blur(130px);
  animation: float 12s infinite ease-in-out;
}

.blob1 {
  top: -150px;
  left: -150px;
}

.blob2 {
  right: -150px;
  bottom: -150px;
  background: var(--accent2);
  animation-delay: -5s;
}

@keyframes float {
  50% {
    transform: translate(70px, 50px);
  }
}

nav {
  width: min(1100px, 90%);
  margin: 20px auto;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--glass);
  backdrop-filter: blur(25px);
  border: 1px solid var(--border);
  border-radius: 20px;
}

.logo {
  font-weight: bold;
  font-size: 20px;
}

.logo span {
  color: var(--accent);
}

.themes {
  display: flex;
  gap: 10px;
}

.theme {
  width: 23px;
  height: 23px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,.5);
}

.purple { background: #8b5cf6; }
.red { background: #ef4444; }
.blue { background: #3b82f6; }
.grey { background: #6b7280; }

main {
  width: min(850px, 90%);
  margin: 80px auto;
  text-align: center;
}

.tag {
  display: inline-block;
  padding: 9px 17px;
  border-radius: 30px;
  background: var(--glass);
  border: 1px solid var(--border);
  color: var(--accent);
}

h1 {
  margin: 25px 0 15px;
  font-size: clamp(45px, 8vw, 80px);
}

h1 span {
  color: var(--accent);
}

.description {
  color: var(--muted);
  line-height: 1.6;
}

.converter {
  margin-top: 45px;
  padding: 30px;
  background: var(--glass);
  backdrop-filter: blur(30px);
  border: 1px solid var(--border);
  border-radius: 28px;
}

.url-box {
  display: flex;
  gap: 10px;
}

.url-input {
  flex: 1;
  padding: 17px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.06);
  color: white;
  outline: none;
  font-size: 15px;
}

.url-input:focus {
  border-color: var(--accent);
}

.download-btn {
  padding: 17px 25px;
  border: none;
  border-radius: 15px;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.download-btn:hover {
  transform: translateY(-2px);
}

.status-box {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: rgba(255,255,255,.04);
  border-radius: 18px;
}

.loader {
  width: 35px;
  height: 35px;
  margin: 0 auto 15px;
  border: 4px solid rgba(255,255,255,.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.status-text {
  color: var(--muted);
}

.info {
  margin-top: 20px;
  color: var(--muted);
  font-size: 13px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #666;
  font-size: 13px;
}

@media(max-width:600px) {
  .url-box {
    flex-direction: column;
  }

  main {
    margin: 60px auto;
  }

  .converter {
    padding: 18px;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
</div>

<nav>
  <div class="logo">
    VIDEO <span>EXTRACTOR</span>
  </div>

  <div class="themes">
    <div class="theme purple" onclick="setTheme('purple')"></div>
    <div class="theme red" onclick="setTheme('red')"></div>
    <div class="theme blue" onclick="setTheme('blue')"></div>
    <div class="theme grey" onclick="setTheme('grey')"></div>
  </div>
</nav>

<main>

<div class="tag">⚡ Direct Media Downloader</div>

<h1>
Download <span>Videos</span>
</h1>

<p class="description">
Paste a direct media file URL to download it.
</p>

<div class="converter">

<div class="url-box">

<input
id="urlInput"
class="url-input"
type="url"
placeholder="Paste direct video URL..."
>

<button
class="download-btn"
onclick="downloadVideo()"
>
Download
</button>

</div>

<div id="statusBox" class="status-box">

<div class="loader"></div>

<div id="statusText" class="status-text">
Preparing download...
</div>

</div>

<div class="info">
Supports publicly accessible direct media file URLs.
</div>

</div>

</main>

<footer>
© 2026 Video Extractor
</footer>

<script>

async function downloadVideo() {

  const url =
    document
      .getElementById("urlInput")
      .value
      .trim();

  if (!url) {
    alert("Please paste a video URL.");
    return;
  }

  const statusBox =
    document.getElementById("statusBox");

  const statusText =
    document.getElementById("statusText");

  statusBox.style.display = "block";

  statusText.innerText =
    "Connecting to media server...";

  try {

    const response =
      await fetch(
        "/api/download",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            url: url
          })
        }
      );

    if (!response.ok) {

      const data =
        await response.json()
        .catch(() => null);

      throw new Error(
        data?.error ||
        "Download failed."
      );
    }

    statusText.innerText =
      "Preparing file...";

    const blob =
      await response.blob();

    const objectURL =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = objectURL;

    link.download = "video.mp4";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(objectURL);

    statusText.innerText =
      "Download started! ✓";

  }

  catch (error) {

    console.error(error);

    statusText.innerText =
      "Error: " + error.message;

  }

}


/* THEMES */

function setTheme(theme) {

  const themes = {

    purple: {
      accent: "#8b5cf6",
      accent2: "#2563eb"
    },

    red: {
      accent: "#ef4444",
      accent2: "#f97316"
    },

    blue: {
      accent: "#3b82f6",
      accent2: "#06b6d4"
    },

    grey: {
      accent: "#6b7280",
      accent2: "#374151"
    }

  };

  document.documentElement.style
    .setProperty(
      "--accent",
      themes[theme].accent
    );

  document.documentElement.style
    .setProperty(
      "--accent2",
      themes[theme].accent2
    );

  localStorage.setItem(
    "theme",
    theme
  );

}

const savedTheme =
  localStorage.getItem("theme");

if (savedTheme) {
  setTheme(savedTheme);
}

</script>

</body>
</html>
