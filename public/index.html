<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Video Extractor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">


<style>

/* =========================
   ROOT
========================= */

:root {

  --accent: #8b5cf6;
  --accent2: #4f46e5;
  --accent-rgb: 139, 92, 246;

  --bg: #030304;

  --text: #f8f8ff;

  --muted: #aaaabc;

  --glass:
  rgba(255,255,255,0.06);

  --border:
  rgba(255,255,255,0.12);

}


/* =========================
   RESET
========================= */

* {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

  font-family:
  Arial,
  sans-serif;

}


html {

  scroll-behavior: smooth;

}


body {

  min-height: 100vh;

  color:
  var(--text);

  background:

  radial-gradient(
    circle at 50% 35%,
    rgba(85, 40, 150, .18),
    transparent 32%
  ),

  radial-gradient(
    circle at 20% 80%,
    rgba(35, 70, 160, .12),
    transparent 30%
  ),

  linear-gradient(
    180deg,
    #030303,
    #08080b 55%,
    #030303
  );

  transition:

  background .6s ease,

  color .4s ease;

  overflow-x: hidden;

}


body.spider-theme,
body.galaxy-theme,
body.ocean-theme,
body.dark-theme,
body.cyber-theme {

  background:

  radial-gradient(
    circle at top left,
    rgba(var(--accent-rgb), .18),
    transparent 35%
  ),

  var(--bg);

}


/* =========================
   AMBIENT STARS + GLOW (DEFAULT)
========================= */

.ambient-stars {

  position: fixed;

  inset: 0;

  z-index: -9;

  pointer-events: none;

  opacity: .5;

  transition: opacity .6s ease;

  background-image:

  radial-gradient(
    circle,
    rgba(255,255,255,.8) 1px,
    transparent 1px
  ),

  radial-gradient(
    circle,
    rgba(150,120,255,.45) 1px,
    transparent 1px
  );

  background-size: 110px 110px, 170px 170px;

  background-position: 20px 30px, 80px 90px;

  animation:
  ambientStarMove
  30s
  linear
  infinite;

}

@keyframes ambientStarMove {

  from {

    background-position:
    20px 30px,
    80px 90px;

  }

  to {

    background-position:
    130px 150px,
    250px 270px;

  }

}

.ambient-glow {

  position: fixed;

  width: 700px;

  height: 700px;

  left: 50%;

  top: 45%;

  transform: translate(-50%, -50%);

  z-index: -9;

  pointer-events: none;

  background:

  radial-gradient(
    circle,
    rgba(117, 55, 220, .13),
    rgba(30, 30, 100, .05),
    transparent 68%
  );

  filter: blur(20px);

  animation:
  ambientBreathe
  6s
  ease-in-out
  infinite;

  opacity: 1;

  transition: opacity .6s ease;

}

@keyframes ambientBreathe {

  0%,
  100% {

    transform:
    translate(-50%, -50%)
    scale(1);

    opacity: .8;

  }

  50% {

    transform:
    translate(-50%, -50%)
    scale(1.12);

    opacity: 1;

  }

}

body.spider-theme .ambient-stars,
body.galaxy-theme .ambient-stars,
body.ocean-theme .ambient-stars,
body.dark-theme .ambient-stars,
body.cyber-theme .ambient-stars,
body.spider-theme .ambient-glow,
body.galaxy-theme .ambient-glow,
body.ocean-theme .ambient-glow,
body.dark-theme .ambient-glow,
body.cyber-theme .ambient-glow {

  opacity: 0;

}


/* =========================
   BACKGROUND
========================= */

.background {

  position: fixed;

  inset: 0;

  overflow: hidden;

  z-index: -10;

  pointer-events: none;

}


.blob {

  position: absolute;

  width: 450px;

  height: 450px;

  border-radius: 50%;

  background:
  var(--accent);

  filter:
  blur(140px);

  opacity: 0;

  animation:
  blobMove
  14s
  ease-in-out
  infinite;

  transition:
  opacity .6s ease;

}


body.spider-theme .blob,
body.galaxy-theme .blob,
body.ocean-theme .blob,
body.dark-theme .blob,
body.cyber-theme .blob {

  opacity: .18;

}


.blob1 {

  top: -180px;

  left: -180px;

}


.blob2 {

  right: -180px;

  bottom: -180px;

  background:
  var(--accent2);

  animation-delay:
  -6s;

}


@keyframes blobMove {

  0%,
  100% {

    transform:
    translate(0,0);

  }


  50% {

    transform:
    translate(
      100px,
      70px
    );

  }

}


/* =========================
   OCEAN THEME
========================= */

.ocean-waves {

  position: fixed;

  inset: 0;

  overflow: hidden;

  pointer-events: none;

  z-index: -9;

  opacity: 0;

  transition:
  opacity .7s ease;

}


body.ocean-theme
.ocean-waves {

  opacity: 1;

}


.ocean-wave {

  position: absolute;

  width: 180%;

  height: 300px;

  left: -40%;

  border-radius: 45%;

  background:

  rgba(
    0,
    229,
    255,
    .08
  );

  filter:
  blur(20px);

  animation:
  oceanMove
  12s
  ease-in-out
  infinite;

}


.wave1 {

  bottom: -150px;

}


.wave2 {

  bottom: -180px;

  background:
  rgba(0,150,255,.1);

  animation-delay:
  -5s;

}


.wave3 {

  bottom: -210px;

  background:
  rgba(0,255,220,.06);

  animation-delay:
  -8s;

}


@keyframes oceanMove {

  0%,
  100% {

    transform:
    translateX(-5%)
    rotate(0deg);

  }


  50% {

    transform:
    translateX(5%)
    rotate(3deg);

  }

}


body.ocean-theme {

  --accent: #00e5ff;

  --accent2: #0077ff;

  --accent-rgb: 0, 229, 255;

  --bg: #010a0e;

  background:

  radial-gradient(
    circle at top left,
    rgba(0,229,255,.08),
    transparent 40%
  ),

  radial-gradient(
    circle at bottom right,
    rgba(0,119,255,.06),
    transparent 40%
  ),

  linear-gradient(
    180deg,
    #021620 0%,
    #010d14 30%,
    #01080d 65%,
    #000306 100%
  );

}


/* =========================
   OCEAN BUBBLES
========================= */

.ocean-bubbles {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -6;

  opacity: 0;

  transition:
  opacity .6s ease;

}


body.ocean-theme
.ocean-bubbles {

  opacity: 1;

}


.bubble {

  position: absolute;

  width: 10px;

  height: 10px;

  border-radius: 50%;

  border:

  1px solid
  rgba(150,255,255,.45);

  box-shadow:

  0 0 15px
  rgba(0,229,255,.2);

  animation:
  bubbleRise
  8s
  linear
  infinite;

}


.bubble:nth-child(1) {

  left: 10%;
  bottom: -20px;

}


.bubble:nth-child(2) {

  left: 25%;
  bottom: -40px;

  width: 6px;
  height: 6px;

  animation-delay: 2s;

}


.bubble:nth-child(3) {

  left: 45%;
  bottom: -30px;

  animation-delay: 4s;

}


.bubble:nth-child(4) {

  left: 70%;
  bottom: -50px;

  width: 14px;
  height: 14px;

  animation-delay: 1s;

}


@keyframes bubbleRise {

  from {

    transform:
    translateY(0);

    opacity: 0;

  }


  20% {

    opacity: .7;

  }


  80% {

    opacity: .4;

  }


  to {

    transform:
    translateY(-110vh);

    opacity: 0;

  }

}


/* =========================
   SPIDER THEME
========================= */

.spider-web {

  position: fixed;

  pointer-events: none;

  z-index: -3;

  opacity: 0;

  transition:
  opacity .6s ease;

  width: 250px;

  height: 250px;

}


body.spider-theme
.spider-web {

  opacity: .45;

}


.web-left {

  top: 0;

  left: 0;

  border-radius:
  0 0 100% 0;

  background:

  repeating-radial-gradient(

    circle at top left,

    transparent 0px,

    transparent 18px,

    rgba(180,30,40,.3)
    19px,

    transparent 21px

  );

  border-right:

  1px solid
  rgba(180,30,40,.25);

  border-bottom:

  1px solid
  rgba(180,30,40,.25);

}


.web-right {

  right: 0;

  bottom: 0;

  border-radius:
  100% 0 0 0;

  background:

  repeating-radial-gradient(

    circle at bottom right,

    transparent 0px,

    transparent 18px,

    rgba(180,30,40,.3)
    19px,

    transparent 21px

  );

  border-left:

  1px solid
  rgba(180,30,40,.25);

  border-top:

  1px solid
  rgba(180,30,40,.25);

}


/* =========================
   GALAXY BACKGROUND
========================= */

.galaxy-stars {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -8;

  opacity: 0;

  transition:
  opacity .6s ease;

  background-image:

  radial-gradient(
    circle,
    white 1px,
    transparent 1.5px
  ),

  radial-gradient(
    circle,
    rgba(180,200,255,.8) 1px,
    transparent 1.5px
  ),

  radial-gradient(
    circle,
    rgba(255,255,255,.6) 1px,
    transparent 1.5px
  );

  background-size:

  90px 90px,

  140px 140px,

  200px 200px;

  animation:
  starsMove
  20s
  linear
  infinite;

}


body.galaxy-theme
.galaxy-stars {

  opacity: 1;

}


@keyframes starsMove {

  from {

    background-position:

    0 0,

    20px 40px,

    50px 80px;

  }


  to {

    background-position:

    90px 120px,

    160px 180px,

    250px 220px;

  }

}


/* =========================
   SPARKLES
========================= */

.sparkles {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: -7;

  opacity: 0;

  transition:
  opacity .6s ease;

}


body.galaxy-theme
.sparkles {

  opacity: 1;

}


.sparkle {

  position: absolute;

  width: 4px;

  height: 4px;

  background: white;

  border-radius: 50%;

  box-shadow:

  0 0 8px white,

  0 0 18px
  rgba(150,180,255,.8);

  animation:

  sparkle
  3s
  ease-in-out
  infinite;

}


.sparkle:nth-child(1) {

  top: 15%;

  left: 12%;

}


.sparkle:nth-child(2) {

  top: 30%;

  left: 80%;

  animation-delay: 1s;

}


.sparkle:nth-child(3) {

  top: 70%;

  left: 18%;

  animation-delay: 2s;

}


.sparkle:nth-child(4) {

  top: 55%;

  left: 90%;

  animation-delay: .5s;

}


.sparkle:nth-child(5) {

  top: 80%;

  left: 60%;

  animation-delay: 1.5s;

}


.sparkle:nth-child(6) {

  top: 10%;

  left: 50%;

  animation-delay: 2.5s;

}


@keyframes sparkle {

  0%,
  100% {

    transform:
    scale(.5);

    opacity: .3;

  }


  50% {

    transform:
    scale(2);

    opacity: 1;

  }

}


/* =========================
   NAV
========================= */

nav {

  width:
  min(1100px,90%);

  margin:
  20px auto;

  padding:
  16px 20px;

  display: flex;

  justify-content:
  space-between;

  align-items:
  center;

  background:
  transparent;

  border: none;

  animation:
  navEnter
  .8s
  ease;

}


@keyframes navEnter {

  from {

    opacity: 0;

    transform:
    translateY(-20px);

  }


  to {

    opacity: 1;

    transform:
    translateY(0);

  }

}


.logo {

  font-size: 18px;

  font-weight: 700;

  letter-spacing: .3px;

}


.logo span {

  color:
  var(--muted);

  font-weight: 600;

}


/* =========================
   MENU BUTTON
========================= */

.menu-btn {

  width: 46px;

  height: 46px;

  border-radius: 14px;

  border:

  1px solid
  var(--border);

  background:
  rgba(255,255,255,.05);

  color: white;

  font-size: 23px;

  cursor: pointer;

  transition: .3s;

  display: flex;

  align-items: center;

  justify-content: center;

}


.menu-btn:hover {

  transform:
  scale(1.07);

  background:

  rgba(
    var(--accent-rgb),
    .18
  );

  border-color:
  var(--accent);

}


/* =========================
   OVERLAY
========================= */

.menu-overlay {

  position: fixed;

  inset: 0;

  background:
  rgba(0,0,0,.45);

  backdrop-filter:
  blur(5px);

  opacity: 0;

  pointer-events: none;

  transition: .3s;

  z-index: 20;

}


.menu-overlay.active {

  opacity: 1;

  pointer-events: auto;

}


/* =========================
   SIDE MENU
========================= */

.side-menu {

  position: fixed;

  top: 0;

  right: -380px;

  width:
  min(360px,90%);

  height: 100vh;

  padding: 25px;

  background:
  rgba(15,15,25,.88);

  backdrop-filter:
  blur(30px);

  border-left:

  1px solid
  var(--border);

  z-index: 30;

  transition:

  .4s
  cubic-bezier(
    .2,
    .8,
    .2,
    1
  );

  overflow-y: auto;

}


.side-menu.active {

  right: 0;

}


/* =========================
   MAIN
========================= */

main {

  width:
  min(850px,90%);

  margin:
  80px auto;

  text-align: center;

  position: relative;

}


/* =========================
   TAG
========================= */

.tag {

  display:
  inline-flex;

  align-items:
  center;

  gap: 8px;

  padding:
  10px 22px;

  border-radius:
  30px;

  background:
  transparent;

  border:

  1px solid
  var(--border);

  color:
  var(--muted);

  font-size: 13px;

  font-weight: 600;

  letter-spacing: 3px;

  animation:
  fadeUp
  .7s
  ease;

}


/* =========================
   TITLE
========================= */

.title {

  margin:
  28px 0 18px;

  font-size:
  clamp(
    55px,
    10vw,
    100px
  );

  line-height: .9;

  letter-spacing:
  -4px;

  font-weight: 900;

  font-family:
  Arial,
  sans-serif;

  text-transform:
  uppercase;

  animation:

  titleEnter
  1s
  cubic-bezier(
    .2,
    .8,
    .2,
    1
  );

}


.title .download {

  display: block;

  color: white;

}


.title .videos {

  display: block;

  margin-top: 10px;

  color: white;

}


@keyframes titleEnter {

  from {

    opacity: 0;

    transform:

    translateY(40px)

    scale(.95);

  }


  to {

    opacity: 1;

    transform:

    translateY(0)

    scale(1);

  }

}


@keyframes fadeUp {

  from {

    opacity: 0;

    transform:
    translateY(20px);

  }


  to {

    opacity: 1;

    transform:
    translateY(0);

  }

}


.description {

  color:
  var(--muted);

  line-height: 1.7;

  font-size: 17px;

}


/* =========================
   CONVERTER
========================= */

.converter {

  margin-top: 50px;

  padding: 30px;

  background:

  linear-gradient(

    145deg,

    rgba(255,255,255,.09),

    rgba(255,255,255,.035)

  );

  backdrop-filter:
  blur(35px);

  border:

  1px solid
  var(--border);

  border-radius:
  30px;

  box-shadow:

  0
  25px
  80px
  rgba(0,0,0,.25);

}


/* =========================
   FORMAT SWITCH
========================= */

.format-switch {

  display: flex;

  gap: 10px;

  padding: 8px;

  width: 100%;

  margin:
  0 0 25px;

  border-radius:
  20px;

  background:
  rgba(0,0,0,.2);

  border:

  1px solid
  var(--border);

}


.format-btn {

  flex: 1;

  border: none;

  background:
  transparent;

  color:
  var(--muted);

  padding:
  16px 24px;

  border-radius:
  15px;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;

  transition: .35s;

}


.format-btn.active {

  color: white;

  background:

  linear-gradient(

    135deg,

    var(--accent),

    var(--accent2)

  );

  box-shadow:

  0
  8px
  30px

  rgba(
    var(--accent-rgb),
    .3
  );

}


/* =========================
   URL BOX
========================= */

.url-box {

  display: flex;

  gap: 12px;

}


.url-input {

  flex: 1;

  padding: 20px;

  border-radius:
  20px;

  border:

  1px solid
  var(--border);

  background:
  rgba(255,255,255,.06);

  color: white;

  outline: none;

  font-size: 16px;

}


.url-input:focus {

  border-color:
  var(--accent);

  box-shadow:

  0
  0
  0
  4px

  rgba(
    var(--accent-rgb),
    .1
  );

}


/* =========================
   DOWNLOAD BUTTON
========================= */

.download-btn {

  min-width: 150px;

  padding:
  20px 25px;

  border: none;

  border-radius:
  20px;

  background:

  linear-gradient(

    135deg,

    var(--accent),

    var(--accent2)

  );

  color: white;

  font-weight: 700;

  font-size: 15px;

  cursor: pointer;

  transition: .3s;

}


.download-btn:hover {

  transform:
  translateY(-3px);

  box-shadow:

  0
  15px
  40px

  rgba(
    var(--accent-rgb),
    .35
  );

}


.download-btn:active {

  transform:
  translateY(-1px);

}


.download-btn:disabled {

  opacity: .6;

  cursor: not-allowed;

}


/* =========================
   STATUS BOX
========================= */

.status-box {

  display: none;

  flex-direction: column;

  align-items: center;

  justify-content:
  center;

  gap: 20px;

  padding: 25px;

  margin-top: 25px;

  background:
  rgba(0,0,0,.2);

  border:

  1px solid
  var(--border);

  border-radius:
  20px;

  min-height: 100px;

}


.loader {

  display: none;

  width: 50px;

  height: 50px;

  border:

  3px solid

  rgba(
    var(--accent-rgb),
    .25
  );

  border-top-color:
  var(--accent);

  border-radius: 50%;

  animation:
  spin .8s
  linear
  infinite;

}


@keyframes spin {

  to {

    transform:
    rotate(360deg);

  }

}


.status-text {

  font-size: 15px;

  color: var(--muted);

}


/* =========================
   INFO
========================= */

.info {

  font-size: 13px;

  color:
  rgba(var(--text), 0.5);

  text-align: center;

  margin-top: 20px;

}


/* =========================
   FOOTER
========================= */

footer {

  position: fixed;

  bottom: 20px;

  left: 50%;

  transform: translateX(-50%);

  font-size: 12px;

  color: var(--muted);

}


/* =========================
   LIST OPTIONS
========================= */

.list-option {

  width: 100%;

  padding: 17px;

  display: flex;

  align-items: center;

  gap: 14px;

  border-radius: 15px;

  border:

  1px solid
  var(--border);

  background:
  rgba(255,255,255,.05);

  color: white;

  font-size: 16px;

  cursor: pointer;

  transition: .3s;

  margin-bottom: 12px;

}


.list-option:hover {

  transform:
  translateX(5px);

  border-color:
  var(--accent);

}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

  main {

    margin: 100px auto 60px;

  }

  .title {

    font-size: 36px;

  }

  .converter {

    padding: 20px;

  }

  .url-box {

    flex-direction: column;

  }

  .download-btn {

    width: 100%;

  }

}

</style>

</head>

<body>

<div class="background">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
</div>

<div class="ambient-stars"></div>
<div class="ambient-glow"></div>

<div class="galaxy-stars"></div>

<div class="sparkles">
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
</div>

<div class="ocean-waves">
  <div class="ocean-wave wave1"></div>
  <div class="ocean-wave wave2"></div>
  <div class="ocean-wave wave3"></div>
</div>

<div class="ocean-bubbles">
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
</div>

<div class="spider-web web-left"></div>
<div class="spider-web web-right"></div>

<!-- MENU OVERLAY -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">
  <div style="flex: 1;"></div>

  <button class="list-option" onclick="setTheme('default')">
    ✨ Default Theme
  </button>

  <button class="list-option" onclick="setTheme('ocean')">
    🌊 Ocean Theme
  </button>

  <button class="list-option" onclick="setTheme('galaxy')">
    🌌 Galaxy Theme
  </button>

  <button class="list-option" onclick="setTheme('spider')">
    🕷️ Spider Theme
  </button>

  <button class="list-option" onclick="setTheme('dark')">
    🌙 Dark Theme
  </button>
</div>

<!-- NAV -->
<nav>
  <div class="logo">
    VIDEO
    <span>EXTRACTOR</span>
  </div>

  <button class="menu-btn" onclick="openMenu()">
    ☰
  </button>
</nav>

<!-- MAIN -->
<main>
  <div class="tag">
    ⚡ Personal Media Converter
  </div>

  <h1 class="title">
    <span class="download">Download</span>
    <span class="videos">Videos</span>
  </h1>

  <p class="description">
    Download YouTube videos, TikTok, Instagram or convert
    your media into MP3 audio.
  </p>

  <!-- CONVERTER -->
  <div class="converter">

    <!-- FORMAT SWITCH -->
    <div class="format-switch">
      <button class="format-btn active" id="mp4Btn" onclick="setFormat('mp4')">
        🎬 MP4
      </button>
      <button class="format-btn" id="mp3Btn" onclick="setFormat('mp3')">
        🎵 MP3
      </button>
    </div>

    <!-- URL INPUT -->
    <div class="url-box">
      <input
        id="urlInput"
        class="url-input"
        type="url"
        placeholder="Paste YouTube or media URL..."
      >
      <button class="download-btn" id="downloadBtn" onclick="downloadMedia()">
        Download
      </button>
    </div>

    <!-- STATUS -->
    <div id="statusBox" class="status-box">
      <div class="loader" id="loader"></div>
      <div id="statusText" class="status-text">
        Preparing...
      </div>
    </div>

    <div class="info" id="infoText">
      Supports YouTube, TikTok, Instagram, and direct media file URLs.
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer>
  © 2026 Video Extractor
</footer>

<script>

/* MENU */
function openMenu() {
  document.getElementById("sideMenu").classList.add("active");
  document.getElementById("menuOverlay").classList.add("active");
}

function closeMenu() {
  document.getElementById("sideMenu").classList.remove("active");
  document.getElementById("menuOverlay").classList.remove("active");
}

/* THEME */
function setTheme(theme) {
  const body = document.body;
  body.classList.remove(
    "ocean-theme",
    "galaxy-theme",
    "spider-theme",
    "dark-theme"
  );

  if (theme === "ocean") {
    body.classList.add("ocean-theme");
  } else if (theme === "galaxy") {
    body.classList.add("galaxy-theme");
  } else if (theme === "spider") {
    body.classList.add("spider-theme");
  } else if (theme === "dark") {
    body.classList.add("dark-theme");
  }

  closeMenu();
}

/* FORMAT */
let selectedFormat = "mp4";

function setFormat(format) {
  selectedFormat = format;

  const mp4Btn = document.getElementById("mp4Btn");
  const mp3Btn = document.getElementById("mp3Btn");
  const input = document.getElementById("urlInput");
  const button = document.getElementById("downloadBtn");
  const info = document.getElementById("infoText");

  if (format === "mp3") {
    mp3Btn.classList.add("active");
    mp4Btn.classList.remove("active");

    button.innerText = "Convert to MP3";
    info.innerText = "Audio will be extracted and converted to MP3.";
  } else {
    mp4Btn.classList.add("active");
    mp3Btn.classList.remove("active");

    button.innerText = "Download";
    info.innerText = "Supports YouTube, TikTok, Instagram, and direct media file URLs.";
  }
}

/* DOWNLOAD */
async function downloadMedia() {
  const url = document.getElementById("urlInput").value.trim();

  if (!url) {
    alert("Please paste a media URL.");
    return;
  }

  const statusBox = document.getElementById("statusBox");
  const statusText = document.getElementById("statusText");
  const loader = document.getElementById("loader");
  const button = document.getElementById("downloadBtn");

  statusBox.style.display = "flex";
  loader.style.display = "block";

  statusText.innerText = selectedFormat === "mp3"
    ? "Converting media to MP3..."
    : "Downloading video...";

  button.disabled = true;
  button.style.opacity = ".6";

  try {
    const backendURL = window.location.origin;

    const endpoint = selectedFormat === "mp3"
      ? backendURL + "/api/convert/mp3"
      : backendURL + "/api/download";

    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url: url })
    });

    if (!response.ok) {
      const data = await response.json().catch(() => null);
      throw new Error(data?.error || "Request failed.");
    }

    statusText.innerText = selectedFormat === "mp3"
      ? "Preparing MP3..."
      : "Preparing file...";

    const blob = await response.blob();
    const objectURL = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = objectURL;
    link.download = selectedFormat === "mp3" ? "audio.mp3" : "video.mp4";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(objectURL);

    loader.style.display = "none";
    statusText.innerText = selectedFormat === "mp3"
      ? "MP3 download started! ✓"
      : "Download started! ✓";

  } catch (error) {
    console.error(error);
    loader.style.display = "none";
    statusText.innerText = "Error: " + error.message;
  } finally {
    button.disabled = false;
    button.style.opacity = "1";
  }
}

</script>

</body>

</html>
