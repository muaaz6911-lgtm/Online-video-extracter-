<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Extractor</title>

<style>

:root {
  --accent: #8b5cf6;
  --accent2: #4f46e5;
  --accent-rgb: 139, 92, 246;

  --bg: #07070d;
  --text: #f8f8ff;
  --muted: #aaaabc;

  --glass: rgba(255,255,255,0.06);
  --glass-strong: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.12);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(
      circle at top left,
      rgba(var(--accent-rgb), .18),
      transparent 35%
    ),
    #07070d;

  transition:
    background .6s ease,
    color .4s ease;

  overflow-x: hidden;
}

/* BACKGROUND */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -1;
}

.blob {
  position: absolute;

  width: 450px;
  height: 450px;

  border-radius: 50%;

  background: var(--accent);

  filter: blur(140px);

  opacity: .18;

  animation:
    blobMove 14s ease-in-out infinite;
}

.blob1 {
  top: -180px;
  left: -180px;
}

.blob2 {
  right: -180px;
  bottom: -180px;

  background: var(--accent2);

  animation-delay: -6s;
}

@keyframes blobMove {

  0%,100% {
    transform: translate(0,0);
  }

  50% {
    transform: translate(100px,70px);
  }

}

/* NAV */

nav {

  width: min(1100px, 90%);

  margin: 20px auto;

  padding: 16px 20px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  background: var(--glass);

  backdrop-filter: blur(25px);

  -webkit-backdrop-filter: blur(25px);

  border:
    1px solid var(--border);

  border-radius: 22px;

  animation:
    navEnter .8s ease;

}

@keyframes navEnter {

  from {
    opacity: 0;
    transform: translateY(-20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

.logo {

  font-size: 18px;

  font-weight: 700;

  letter-spacing: 2px;

}

.logo span {

  color: var(--accent);

}

/* MENU BUTTON */

.menu-btn {

  width: 46px;
  height: 46px;

  border-radius: 14px;

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.05);

  color: white;

  font-size: 23px;

  cursor: pointer;

  transition:
    .3s;

}

.menu-btn:hover {

  transform: scale(1.07);

  background:
    rgba(var(--accent-rgb),.18);

  border-color:
    var(--accent);

}

/* SIDE MENU */

.menu-overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(5px);

  opacity: 0;

  pointer-events: none;

  transition:
    .3s;

  z-index: 20;

}

.menu-overlay.active {

  opacity: 1;

  pointer-events: auto;

}

.side-menu {

  position: fixed;

  top: 0;

  right: -380px;

  width: min(360px, 90%);

  height: 100vh;

  padding: 25px;

  background:
    rgba(15,15,25,.75);

  backdrop-filter:
    blur(30px);

  border-left:
    1px solid var(--border);

  z-index: 30;

  transition:
    .4s cubic-bezier(.2,.8,.2,1);

}

.side-menu.active {

  right: 0;

}

.menu-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 35px;

}

.menu-header h2 {

  font-size: 24px;

}

.close-btn {

  width: 42px;
  height: 42px;

  border-radius: 12px;

  border:
    1px solid var(--border);

  background:
    transparent;

  color: white;

  font-size: 20px;

  cursor: pointer;

}

.menu-section {

  margin-top: 25px;

}

.menu-section h3 {

  margin-bottom: 15px;

  color:
    var(--muted);

  font-size: 14px;

  text-transform:
    uppercase;

  letter-spacing: 2px;

}

/* THEMES */

.theme-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;

}

.theme-option {

  padding: 14px;

  border-radius: 16px;

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.05);

  cursor: pointer;

  color: white;

  display: flex;

  align-items: center;

  gap: 10px;

  transition:
    .3s;

}

.theme-option:hover {

  transform:
    translateY(-3px);

  border-color:
    var(--accent);

}

.theme-dot {

  width: 18px;
  height: 18px;

  border-radius: 50%;

}

.dot-purple {
  background: #8b5cf6;
}

.dot-red {
  background: #ef4444;
}

.dot-blue {
  background: #3b82f6;
}

.dot-green {
  background: #22c55e;
}

.dot-pink {
  background: #ec4899;
}

.dot-cyber {
  background: #00e5ff;
}

.dot-orange {
  background: #f97316;
}

.dot-gold {
  background: #eab308;
}

/* MAIN */

main {

  width:
    min(850px,90%);

  margin:
    80px auto;

  text-align:
    center;

}

/* TAG */

.tag {

  display:
    inline-flex;

  align-items:
    center;

  gap: 8px;

  padding:
    10px 18px;

  border-radius:
    30px;

  background:
    var(--glass);

  border:
    1px solid var(--border);

  color:
    var(--accent);

  animation:
    fadeUp .7s ease;

}

/* TITLE */

.title {

  margin:
    28px 0 18px;

  font-size:
    clamp(55px,10vw,100px);

  line-height:
    .9;

  letter-spacing:
    -4px;

  animation:
    titleEnter 1s cubic-bezier(.2,.8,.2,1);

}

.title .download {

  display:
    block;

  color:
    white;

}

.title .videos {

  display:
    block;

  margin-top:
    10px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  -webkit-background-clip:
    text;

  color:
    transparent;

}

@keyframes titleEnter {

  from {

    opacity: 0;

    transform:
      translateY(40px)
      scale(.95);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

  }

}

@keyframes fadeUp {

  from {

    opacity: 0;

    transform:
      translateY(20px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}

.description {

  color:
    var(--muted);

  line-height:
    1.7;

  font-size:
    17px;

  animation:
    fadeUp .9s ease;

}

/* CONVERTER */

.converter {

  margin-top:
    50px;

  padding:
    30px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  backdrop-filter:
    blur(35px);

  border:
    1px solid var(--border);

  border-radius:
    30px;

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.25);

  animation:
    converterEnter 1s ease;

}

@keyframes converterEnter {

  from {

    opacity: 0;

    transform:
      translateY(30px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}

/* FORMAT SWITCH */

.format-switch {

  display:
    flex;

  gap:
    10px;

  padding:
    7px;

  width:
    fit-content;

  margin:
    0 auto 25px;

  border-radius:
    18px;

  background:
    rgba(0,0,0,.2);

  border:
    1px solid var(--border);

}

.format-btn {

  border:
    none;

  background:
    transparent;

  color:
    var(--muted);

  padding:
    13px 24px;

  border-radius:
    13px;

  font-size:
    16px;

  cursor:
    pointer;

  transition:
    .35s;

}

.format-btn.active {

  color:
    white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  box-shadow:
    0 8px 30px
    rgba(var(--accent-rgb),.3);

}

/* URL */

.url-box {

  display:
    flex;

  gap:
    12px;

}

.url-input {

  flex:
    1;

  padding:
    18px;

  border-radius:
    16px;

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.06);

  color:
    white;

  outline:
    none;

  font-size:
    15px;

  transition:
    .3s;

}

.url-input:focus {

  border-color:
    var(--accent);

  box-shadow:
    0 0 0 4px
    rgba(var(--accent-rgb),.1);

}

.download-btn {

  min-width:
    150px;

  padding:
    18px 25px;

  border:
    none;

  border-radius:
    16px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  color:
    white;

  font-weight:
    bold;

  font-size:
    15px;

  cursor:
    pointer;

  transition:
    .3s;

}

.download-btn:hover {

  transform:
    translateY(-3px);

  box-shadow:
    0 15px 40px
    rgba(var(--accent-rgb),.35);

}

.download-btn:active {

  transform:
    scale(.97);

}

/* STATUS */

.status-box {

  display:
    none;

  margin-top:
    25px;

  padding:
    22px;

  border-radius:
    18px;

  background:
    rgba(255,255,255,.05);

  border:
    1px solid var(--border);

}

.loader {

  width:
    36px;

  height:
    36px;

  margin:
    0 auto 15px;

  border:
    3px solid
    rgba(255,255,255,.1);

  border-top-color:
    var(--accent);

  border-radius:
    50%;

  animation:
    spin .8s linear infinite;

}

@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}

.status-text {

  color:
    var(--muted);

}

.info {

  margin-top:
    20px;

  color:
    var(--muted);

  font-size:
    13px;

}

/* FOOTER */

footer {

  text-align:
    center;

  padding:
    35px;

  color:
    #666;

}

/* MOBILE */

@media(max-width:600px) {

  nav {

    width:
      92%;

  }

  main {

    margin:
      60px auto;

  }

  .converter {

    padding:
      18px;

  }

  .url-box {

    flex-direction:
      column;

  }

  .download-btn {

    width:
      100%;

  }

  .title {

    letter-spacing:
      -2px;

  }

}

</style>
</head>

<body>

<div class="background">

  <div class="blob blob1"></div>

  <div class="blob blob2"></div>

</div>


<!-- MENU OVERLAY -->

<div
class="menu-overlay"
id="menuOverlay"
onclick="closeMenu()"
></div>


<!-- SIDE MENU -->

<div
class="side-menu"
id="sideMenu"
>

<div class="menu-header">

<h2>Appearance</h2>

<button
class="close-btn"
onclick="closeMenu()"
>
✕
</button>

</div>


<div class="menu-section">

<h3>Choose Theme</h3>

<div class="theme-grid">

<button
class="theme-option"
onclick="setTheme('purple')"
>

<span
class="theme-dot dot-purple"
></span>

Purple

</button>


<button
class="theme-option"
onclick="setTheme('red')"
>

<span
class="theme-dot dot-red"
></span>

Red

</button>


<button
class="theme-option"
onclick="setTheme('blue')"
>

<span
class="theme-dot dot-blue"
></span>

Blue

</button>


<button
class="theme-option"
onclick="setTheme('green')"
>

<span
class="theme-dot dot-green"
></span>

Green

</button>


<button
class="theme-option"
onclick="setTheme('pink')"
>

<span
class="theme-dot dot-pink"
></span>

Pink

</button>


<button
class="theme-option"
onclick="setTheme('cyber')"
>

<span
class="theme-dot dot-cyber"
></span>

Cyber

</button>


<button
class="theme-option"
onclick="setTheme('orange')"
>

<span
class="theme-dot dot-orange"
></span>

Orange

</button>


<button
class="theme-option"
onclick="setTheme('gold')"
>

<span
class="theme-dot dot-gold"
></span>

Gold

</button>

</div>

</div>

</div>


<!-- NAV -->

<nav>

<div class="logo">

VIDEO
<span>
EXTRACTOR
</span>

</div>

<button
class="menu-btn"
onclick="openMenu()"
>
☰
</button>

</nav>


<!-- MAIN -->

<main>

<div class="tag">

⚡ Personal Media Converter

</div>


<h1 class="title">

<span class="download">

Download

</span>

<span class="videos">

Videos

</span>

</h1>


<p class="description">

Download direct media files or convert your media
into MP3 audio.

</p>


<div class="converter">


<!-- FORMAT -->

<div class="format-switch">

<button
class="format-btn active"
id="mp4Btn"
onclick="setFormat('mp4')"
>

🎬 MP4

</button>


<button
class="format-btn"
id="mp3Btn"
onclick="setFormat('mp3')"
>

🎵 MP3

</button>

</div>


<!-- URL -->

<div class="url-box">

<input
id="urlInput"
class="url-input"
type="url"
placeholder="Paste direct media URL..."
>

<button
class="download-btn"
id="downloadBtn"
onclick="downloadMedia()"
>

Download

</button>

</div>


<!-- STATUS -->

<div
id="statusBox"
class="status-box"
>

<div
class="loader"
id="loader"
></div>

<div
id="statusText"
class="status-text"
>

Preparing...

</div>

</div>


<div
class="info"
id="infoText"
>

Supports publicly accessible direct media file URLs.

</div>

</div>

</main>


<footer>

© 2026 Video Extractor

</footer>


<script>

/* =====================
   MENU
===================== */

function openMenu() {

document
.getElementById("sideMenu")
.classList
.add("active");

document
.getElementById("menuOverlay")
.classList
.add("active");

}


function closeMenu() {

document
.getElementById("sideMenu")
.classList
.remove("active");

document
.getElementById("menuOverlay")
.classList
.remove("active");

}


/* =====================
   FORMAT
===================== */

let selectedFormat = "mp4";


function setFormat(format) {

selectedFormat = format;

document
.getElementById("mp4Btn")
.classList
.toggle(
"active",
format === "mp4"
);

document
.getElementById("mp3Btn")
.classList
.toggle(
"active",
format === "mp3"
);


const input =
document.getElementById("urlInput");

const button =
document.getElementById("downloadBtn");

const info =
document.getElementById("infoText");


if (
format === "mp3"
) {

input.placeholder =
"Paste direct video/audio URL...";

button.innerText =
"Convert to MP3";

info.innerText =
"Audio will be extracted and converted to MP3.";

}

else {

input.placeholder =
"Paste direct media URL...";

button.innerText =
"Download";

info.innerText =
"Supports publicly accessible direct media file URLs.";

}

}


/* =====================
   DOWNLOAD
===================== */

async function downloadMedia() {

const url =
document
.getElementById("urlInput")
.value
.trim();


if (!url) {

alert(
"Please paste a media URL."
);

return;

}


const statusBox =
document.getElementById(
"statusBox"
);


const statusText =
document.getElementById(
"statusText"
);


const loader =
document.getElementById(
"loader"
);


const button =
document.getElementById(
"downloadBtn"
);


statusBox.style.display =
"block";


loader.style.display =
"block";


statusText.innerText =
selectedFormat === "mp3"

? "Converting media to MP3..."

: "Connecting to media server...";


button.disabled = true;

button.style.opacity = ".6";


try {

const endpoint =
selectedFormat === "mp3"

? "/api/convert/mp3"

: "/api/download";


const response =
await fetch(
endpoint,
{
method:
"POST",

headers: {

"Content-Type":
"application/json"

},

body:
JSON.stringify({

url:
url

})

}
);


if (
!response.ok
) {

const data =
await response
.json()
.catch(
() => null
);


throw new Error(

data?.error ||

"Request failed."

);

}


statusText.innerText =
selectedFormat === "mp3"

? "Preparing MP3..."

: "Preparing file...";


const blob =
await response.blob();


const objectURL =
URL.createObjectURL(
blob
);


const link =
document.createElement(
"a"
);


link.href =
objectURL;


link.download =
selectedFormat === "mp3"

? "audio.mp3"

: "media.mp4";


document
.body
.appendChild(
link
);


link.click();


link.remove();


URL.revokeObjectURL(
objectURL
);


loader.style.display =
"none";


statusText.innerText =
selectedFormat === "mp3"

? "MP3 download started! ✓"

: "Download started! ✓";


}

catch(error) {

console.error(
error
);


loader.style.display =
"none";


statusText.innerText =

"Error: " +

error.message;

}

finally {

button.disabled =
false;

button.style.opacity =
"1";

}

}


/* =====================
   THEMES
===================== */

function setTheme(theme) {

const themes = {

purple: {

accent:
"#8b5cf6",

accent2:
"#4f46e5",

rgb:
"139,92,246"

},

red: {

accent:
"#ef4444",

accent2:
"#f97316",

rgb:
"239,68,68"

},

blue: {

accent:
"#3b82f6",

accent2:
"#06b6d4",

rgb:
"59,130,246"

},

green: {

accent:
"#22c55e",

accent2:
"#14b8a6",

rgb:
"34,197,94"

},

pink: {

accent:
"#ec4899",

accent2:
"#a855f7",

rgb:
"236,72,153"

},

cyber: {

accent:
"#00e5ff",

accent2:
"#2563eb",

rgb:
"0,229,255"

},

orange: {

accent:
"#f97316",

accent2:
"#ef4444",

rgb:
"249,115,22"

},

gold: {

accent:
"#eab308",

accent2:
"#f97316",

rgb:
"234,179,8"

}

};


document
.documentElement
.style
.setProperty(

"--accent",

themes[theme].accent

);


document
.documentElement
.style
.setProperty(

"--accent2",

themes[theme].accent2

);


document
.documentElement
.style
.setProperty(

"--accent-rgb",

themes[theme].rgb

);


localStorage.setItem(
"theme",
theme
);


closeMenu();

}


/* LOAD SAVED THEME */

const savedTheme =
localStorage.getItem(
"theme"
);


if (
savedTheme
) {

setTheme(
savedTheme
);

}

</script>

</body>
</html>
